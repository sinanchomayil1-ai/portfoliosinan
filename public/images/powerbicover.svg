<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="biBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0d12"/>
      <stop offset="100%" stop-color="#141721"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#biBg)"/>

  <!-- Top Header Bar -->
  <rect x="40" y="30" width="1120" height="70" rx="12" fill="#181c2b" stroke="#2a3045"/>
  <circle cx="80" cy="65" r="14" fill="#f59e0b"/>
  <text x="110" y="71" fill="#f8fafc" font-family="sans-serif" font-size="19" font-weight="bold">Executive BI &amp; Revenue Intelligence Dashboard</text>
  <text x="960" y="70" fill="#94a3b8" font-family="monospace" font-size="14">Power BI • DAX • SQL</text>

  <!-- 4 KPI Cards -->
  <!-- Card 1 -->
  <g transform="translate(40, 125)">
    <rect width="260" height="110" rx="10" fill="#181c2b" stroke="#2a3045"/>
    <text x="24" y="38" fill="#94a3b8" font-family="sans-serif" font-size="13">TOTAL REVENUE (YTD)</text>
    <text x="24" y="75" fill="#f8fafc" font-family="sans-serif" font-size="28" font-weight="bold">$4.82M</text>
    <text x="24" y="98" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="600">▲ +24.8% vs LY</text>
  </g>
  <!-- Card 2 -->
  <g transform="translate(325, 125)">
    <rect width="260" height="110" rx="10" fill="#181c2b" stroke="#2a3045"/>
    <text x="24" y="38" fill="#94a3b8" font-family="sans-serif" font-size="13">AVG ORDER VALUE</text>
    <text x="24" y="75" fill="#f8fafc" font-family="sans-serif" font-size="28" font-weight="bold">$184.50</text>
    <text x="24" y="98" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="600">▲ +12.3% MoM</text>
  </g>
  <!-- Card 3 -->
  <g transform="translate(610, 125)">
    <rect width="260" height="110" rx="10" fill="#181c2b" stroke="#2a3045"/>
    <text x="24" y="38" fill="#94a3b8" font-family="sans-serif" font-size="13">CUSTOMER RETENTION</text>
    <text x="24" y="75" fill="#f8fafc" font-family="sans-serif" font-size="28" font-weight="bold">89.4%</text>
    <text x="24" y="98" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="600">★ Top Decile</text>
  </g>
  <!-- Card 4 -->
  <g transform="translate(895, 125)">
    <rect width="265" height="110" rx="10" fill="#181c2b" stroke="#2a3045"/>
    <text x="24" y="38" fill="#94a3b8" font-family="sans-serif" font-size="13">ACTIVE PIPELINES</text>
    <text x="24" y="75" fill="#f8fafc" font-family="sans-serif" font-size="28" font-weight="bold">1,420</text>
    <text x="24" y="98" fill="#a855f7" font-family="sans-serif" font-size="12" font-weight="600">Automated ETL Sync</text>
  </g>

  <!-- Large Chart Left (Revenue Trend) -->
  <g transform="translate(40, 260)">
    <rect width="660" height="490" rx="12" fill="#181c2b" stroke="#2a3045"/>
    <text x="30" y="45" fill="#f8fafc" font-family="sans-serif" font-size="17" font-weight="bold">Monthly Revenue &amp; Forecast (DAX Time-Intelligence)</text>
    
    <!-- Bars -->
    <rect x="60" y="340" width="35" height="100" rx="4" fill="url(#barGrad)" opacity="0.85"/>
    <rect x="120" y="300" width="35" height="140" rx="4" fill="url(#barGrad)" opacity="0.85"/>
    <rect x="180" y="270" width="35" height="170" rx="4" fill="url(#barGrad)" opacity="0.85"/>
    <rect x="240" y="240" width="35" height="200" rx="4" fill="url(#barGrad)" opacity="0.85"/>
    <rect x="300" y="210" width="35" height="230" rx="4" fill="url(#barGrad)" opacity="0.85"/>
    <rect x="360" y="170" width="35" height="270" rx="4" fill="url(#barGrad)" opacity="0.85"/>
    <rect x="420" y="190" width="35" height="250" rx="4" fill="url(#barGrad)" opacity="0.85"/>
    <rect x="480" y="140" width="35" height="300" rx="4" fill="url(#barGrad)" opacity="0.85"/>
    <rect x="540" y="110" width="35" height="330" rx="4" fill="url(#barGrad)" opacity="0.85"/>

    <!-- Trend Line -->
    <path d="M77 310 Q200 240 317 180 T557 90" fill="none" stroke="url(#lineGrad)" stroke-width="4"/>
    <circle cx="557" cy="90" r="6" fill="#10b981"/>
  </g>

  <!-- Right Top Chart (Category Breakdown) -->
  <g transform="translate(730, 260)">
    <rect width="430" height="230" rx="12" fill="#181c2b" stroke="#2a3045"/>
    <text x="25" y="40" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="bold">Market Share &amp; Margin</text>
    <!-- Donut Simulation -->
    <circle cx="120" cy="130" r="65" fill="none" stroke="#3b82f6" stroke-width="26" stroke-dasharray="210 200"/>
    <circle cx="120" cy="130" r="65" fill="none" stroke="#10b981" stroke-width="26" stroke-dasharray="100 310" stroke-dashoffset="-210"/>
    <circle cx="120" cy="130" r="65" fill="none" stroke="#f59e0b" stroke-width="26" stroke-dasharray="60 350" stroke-dashoffset="-310"/>
    <text x="230" y="100" fill="#93c5fd" font-family="sans-serif" font-size="14">Enterprise: 52%</text>
    <text x="230" y="135" fill="#6ee7b7" font-family="sans-serif" font-size="14">Direct Sales: 31%</text>
    <text x="230" y="170" fill="#fcd34d" font-family="sans-serif" font-size="14">Partner: 17%</text>
  </g>

  <!-- Right Bottom Card (Data Health & Models) -->
  <g transform="translate(730, 520)">
    <rect width="430" height="230" rx="12" fill="#181c2b" stroke="#2a3045"/>
    <text x="25" y="40" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="bold">Star Schema Data Model</text>
    <text x="25" y="75" fill="#94a3b8" font-family="monospace" font-size="13">FACT: FactSales (1.2M rows)</text>
    <text x="25" y="105" fill="#94a3b8" font-family="monospace" font-size="13">DIM: DimCustomer, DimDate, DimProduct</text>
    <rect x="25" y="135" width="380" height="45" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="40" y="163" fill="#38bdf8" font-family="monospace" font-size="13">DAX: CALCULATE(SUM(Sales), FILTER(...))</text>
  </g>
</svg>