<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#060911"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  
  <!-- Grid overlay -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200 M0 600 H1200 M0 700 H1200" />
    <path d="M100 0 V800 M200 0 V800 M300 0 V800 M400 0 V800 M500 0 V800 M600 0 V800 M700 0 V800 M800 0 V800 M900 0 V800 M1000 0 V800 M1100 0 V800" />
  </g>

  <!-- X-Ray Bone Simulation (Skeletal Arm / Forearm) -->
  <g opacity="0.85" filter="url(#glow)">
    <path d="M420 80 Q440 220 450 400 Q460 580 470 720" fill="none" stroke="#e2e8f0" stroke-width="44" stroke-linecap="round" opacity="0.65"/>
    <path d="M500 90 Q520 220 525 380 Q530 540 540 710" fill="none" stroke="#cbd5e1" stroke-width="36" stroke-linecap="round" opacity="0.75"/>
    <!-- Joints -->
    <ellipse cx="440" cy="180" rx="35" ry="25" fill="#f8fafc" opacity="0.5"/>
    <ellipse cx="510" cy="190" rx="30" ry="22" fill="#f8fafc" opacity="0.5"/>
    <ellipse cx="465" cy="580" rx="42" ry="28" fill="#f8fafc" opacity="0.6"/>
  </g>

  <!-- Fracture ROI Bounding Box -->
  <rect x="400" y="340" width="160" height="130" fill="rgba(239, 68, 68, 0.12)" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="8 4" rx="6" />
  <circle cx="480" cy="405" r="32" fill="none" stroke="#f87171" stroke-width="2" opacity="0.7" />
  <line x1="480" y1="365" x2="480" y2="445" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="440" y1="405" x2="520" y2="405" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- AI Tag HUD Overlay -->
  <g transform="translate(580, 350)">
    <rect width="260" height="90" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="1.5" opacity="0.95" />
    <circle cx="24" cy="28" r="6" fill="#ef4444" />
    <text x="38" y="33" fill="#f8fafc" font-family="monospace" font-size="15" font-weight="bold">FRACTURE DETECTED</text>
    <text x="24" y="58" fill="#94a3b8" font-family="monospace" font-size="13">Region: Distal Radius</text>
    <text x="24" y="76" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold">Confidence: 97.4%</text>
  </g>

  <!-- Top Metrics Bar -->
  <g transform="translate(60, 60)">
    <rect width="320" height="100" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" opacity="0.9"/>
    <text x="25" y="38" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="600">MODEL ARCHITECTURE</text>
    <text x="25" y="66" fill="#38bdf8" font-family="monospace" font-size="18" font-weight="bold">ResNet-50 + PyTorch</text>
    <text x="25" y="86" fill="#10b981" font-family="monospace" font-size="12">● Accuracy: 96.8% | F1: 0.95</text>
  </g>

  <!-- Right Side Diagnostic Panel -->
  <g transform="translate(870, 100)">
    <rect width="270" height="300" rx="12" fill="#0f172a" stroke="#1e293b" opacity="0.9"/>
    <text x="24" y="40" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="bold">Image Diagnostics</text>
    
    <text x="24" y="80" fill="#64748b" font-family="monospace" font-size="12">INPUT MATRIX</text>
    <text x="24" y="100" fill="#cbd5e1" font-family="monospace" font-size="14">512 × 512 × 1 GrayScale</text>
    
    <text x="24" y="145" fill="#64748b" font-family="monospace" font-size="12">INFERENCE LATENCY</text>
    <text x="24" y="165" fill="#10b981" font-family="monospace" font-size="14">28ms (GPU Accelerated)</text>

    <text x="24" y="210" fill="#64748b" font-family="monospace" font-size="12">AUGMENTATION</text>
    <text x="24" y="230" fill="#cbd5e1" font-family="monospace" font-size="13">CLAHE, Gaussian Filtering</text>
    
    <rect x="24" y="255" width="222" height="24" rx="6" fill="#1e293b"/>
    <rect x="24" y="255" width="215" height="24" rx="6" fill="#06b6d4" opacity="0.3"/>
    <text x="35" y="271" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">ROC-AUC: 0.982</text>
  </g>
</svg>